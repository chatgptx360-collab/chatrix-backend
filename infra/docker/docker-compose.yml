version: "3.9"

# Local dev stack — Postgres + Redis only.
# Production runs Postgres on Supabase/Neon/RDS and Redis on Upstash/ElastiCache.

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatrix}
      POSTGRES_DB: ${POSTGRES_DB:-chatrix}
    ports:
      - "5432:5432"
    volumes:
      - chatrix_pg_data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatrix} -d ${POSTGRES_DB:-chatrix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatrix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - chatrix_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chatrix_pg_data:
  chatrix_redis_data:
